# Standalone champion generator (NOT the game cdylib — a normal CLI tool).
# Parses bundle.game_data, then emits .data_champion + champion-text override + override_info
# from a champion spec. Its bundle-parse + emit logic will be reused by the Phase 2 in-game UI DLL.
[package]
name = "champion-gen"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
flate2 = "1"
rand = "0.8"
anyhow = "1"

[workspace]
